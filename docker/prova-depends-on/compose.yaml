services:
  lento:
    image: alpine
    command: ["sh", "-c", "sleep 15; touch /tmp/pronto; sleep 3600"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pronto"]
      interval: 3s
      timeout: 2s
      retries: 10
  app:
    image: alpine
    command: ["sh", "-c", "echo partito"]
    depends_on:
      - lento
